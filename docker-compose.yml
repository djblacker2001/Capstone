services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql_server_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Hoangzelo2001!"
      MSSQL_PID: "Developer"
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./:/var/opt/mssql/backup
    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hoangzelo2001!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql_data: