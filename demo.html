<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Công cụ đảo tọa độ Lat-Long</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f9;
        }

        h2 {
            color: #333;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
        }

        button:hover {
            background-color: #0056b3;
        }

        .label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <h2>🔄 Công cụ đảo vị trí Tọa độ</h2>

    <span class="label">Nhập tọa độ (Dạng: Lat, Long - Mỗi cặp 1 dòng):</span>
    <textarea id="inputCoords" placeholder="20.745496, 105.920432&#10;21.028511, 105.804817"></textarea>

    <button onclick="swapCoordinates()">Đảo vị trí (Long, Lat)</button>

    <span class="label">Kết quả:</span>
    <textarea id="outputCoords" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
    <button type="button" onclick="copyOutput()">
        📋 Copy
    </button>

    <script>
        function swapCoordinates() {
            const input = document.getElementById('inputCoords').value;
            if (!input.trim()) {
                alert('Vui lòng nhập tọa độ!');
                return;
            }

            // Tách thành từng dòng
            const lines = input.split('\n');
            const result = lines.map(line => {
                if (!line.trim()) return ''; // Bỏ qua dòng trống

                // Tách bằng dấu phẩy
                const parts = line.split(',');
                if (parts.length === 2) {
                    return `${parts[1].trim()}, ${parts[0].trim()}`;
                }
                return `Dòng lỗi: ${line}`; // Báo lỗi nếu dòng không đúng định dạng
            });

            // Hiển thị kết quả, nối lại bằng dấu xuống dòng
            document.getElementById('outputCoords').value = result.join('\n');
        }
        function copyOutput() {
            const textarea = document.getElementById("outputCoords");

            if (!textarea.value.trim()) {
                return;
            }

            navigator.clipboard.writeText(textarea.value)
                .then(() => {
                })
                .catch(() => {
                    textarea.select();
                    document.execCommand("copy");
                });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</body>

</html>
