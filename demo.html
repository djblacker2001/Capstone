<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ đảo tọa độ Lat-Long</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f9;
        }
        h2 { color: #333; text-align: center; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
        }
        button:hover { background-color: #0056b3; }
        .label { font-weight: bold; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <h2>🔄 Công cụ đảo vị trí Tọa độ</h2>
    
    <span class="label">Nhập tọa độ (Dạng: Lat, Long - Mỗi cặp 1 dòng):</span>
    <textarea id="inputCoords" placeholder="20.745496, 105.920432&#10;21.028511, 105.804817"></textarea>

    <button onclick="swapCoordinates()">Đảo vị trí (Long, Lat)</button>

    <span class="label">Kết quả:</span>
    <textarea id="outputCoords" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>

    <script>
        function swapCoordinates() {
            const input = document.getElementById('inputCoords').value;
            if (!input.trim()) {
                alert('Vui lòng nhập tọa độ!');
                return;
            }

            // Tách thành từng dòng
            const lines = input.split('\n');
            const result = lines.map(line => {
                if (!line.trim()) return ''; // Bỏ qua dòng trống
                
                // Tách bằng dấu phẩy
                const parts = line.split(',');
                if (parts.length === 2) {
                    return `${parts[1].trim()}, ${parts[0].trim()}`;
                }
                return `Dòng lỗi: ${line}`; // Báo lỗi nếu dòng không đúng định dạng
            });

            // Hiển thị kết quả, nối lại bằng dấu xuống dòng
            document.getElementById('outputCoords').value = result.join('\n');
        }
    </script>

</body>
</html>
